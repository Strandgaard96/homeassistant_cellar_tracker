  - title: Cellar
    path: cellar
    cards:
      - type: markdown
        title: By country
        content: |
          | Country | Bottles | Avg value |
          |---|--:|--:|
          {%- set ns = namespace(rows=[]) %}
          {%- for s in states.sensor if s.entity_id.startswith('sensor.cellar_tracker_country_') %}
          {%- set ns.rows = ns.rows + [(s.name | replace('Cellar Tracker country ',''), s.state | int(0), s.attributes.value_avg | default(0))] %}
          {%- endfor %}
          {%- for r in ns.rows | sort(attribute='1', reverse=true) %}
          | {{ r[0] }} | {{ r[1] }} | {{ r[2] | round(0) | int }} |
          {%- endfor %}

