views:
  - title: Overview
    path: overview
    cards:
      - type: glance
        entities:
          - entity: sensor.cellar_tracker_total_bottles
          - entity: sensor.cellar_tracker_total_value
          - entity: sensor.cellar_tracker_average_value
          - entity: sensor.cellar_tracker_average_score

      - type: statistics-graph
        title: Cellar value
        entities:
          - sensor.cellar_tracker_total_value
        stat_types:
          - state
        days_to_show: 365
        period: day

  - title: Explore
    path: explore
    cards:
      - type: markdown
        title: By producer
        content: |
          | Producer | Bottles | Avg value | Avg score |
          |---|--:|--:|--:|
          {%- set items = state_attr('sensor.cellar_tracker_by_producer','items') or [] %}
          {%- for i in items[:25] %}
          | {{ i.name }} | {{ i.count }} | {{ i.value_avg | round(0) | int }} | {{ i.score_avg if i.score_avg else '-' }} |
          {%- endfor %}

          _showing {{ items[:25] | length }} of {{ states('sensor.cellar_tracker_by_producer') }}_

