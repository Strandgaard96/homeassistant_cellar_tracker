views:
  - title: Overview
    path: overview
    cards:
      - type: glance
        entities:
          - entity: sensor.cellar_tracker_total_bottles
          - entity: sensor.cellar_tracker_total_value
          - entity: sensor.cellar_tracker_average_value
          - entity: sensor.cellar_tracker_average_score

      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sensor.cellar_tracker_total_bottles
            icon: mdi:bottle-wine
          - type: entity
            entity: sensor.cellar_tracker_total_value
            icon: mdi:cash
          - type: entity
            entity: sensor.cellar_tracker_average_score
            icon: mdi:star
          - type: entity
            entity: sensor.cellar_tracker_by_producer
            icon: mdi:account-group

      - type: statistics-graph
        title: Cellar value
        entities:
          - sensor.cellar_tracker_total_value
        stat_types:
          - state
        days_to_show: 365
        period: day

  - title: Explore
    path: explore
    cards:
      - type: custom:flex-table-card
        title: By producer
        entities:
          include: sensor.cellar_tracker_by_producer
        max_rows: 50
        sort_by: count-
        columns:
          - name: Producer
            id: name
            data: items.name
          - name: Bottles
            id: count
            data: items.count
          - name: Avg value
            id: value_avg
            data: items.value_avg
            modify: parseFloat(x).toFixed(0)
          - name: Avg score
            id: score_avg
            data: items.score_avg
            modify: "x === null ? '-' : parseFloat(x).toFixed(1)"

