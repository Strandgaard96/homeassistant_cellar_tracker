views:
- title: Cellar
  path: cellar
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Cellar at a glance
      heading_style: title
      icon: mdi:bottle-wine
    - type: tile
      entity: sensor.cellar_tracker_total_bottles
      icon: mdi:bottle-wine
      color: red
      name: Bottles
    - type: tile
      entity: sensor.cellar_tracker_total_value
      icon: mdi:cash-multiple
      color: green
      name: Cellar value
    - type: tile
      entity: sensor.cellar_tracker_average_value
      icon: mdi:tag
      color: teal
      name: Avg bottle
    - type: tile
      entity: sensor.cellar_tracker_average_score
      icon: mdi:star
      color: amber
      name: Avg CT score
    - type: tile
      entity: sensor.cellar_tracker_by_producer
      icon: mdi:account-group
      color: purple
      name: Producers
    - type: tile
      entity: sensor.cellar_tracker_by_region
      icon: mdi:map-marker
      color: blue
      name: Regions
  - type: grid
    cards:
    - type: heading
      heading: Composition
      heading_style: title
    - type: custom:apexcharts-card
      chart_type: donut
      header:
        show: true
        title: By colour
        show_states: false
      series:
      - entity: sensor.cellar_tracker_color_red
        name: Red
      - entity: sensor.cellar_tracker_color_white
        name: White
      - entity: sensor.cellar_tracker_color_ros
        name: Rosé
      apex_config:
        colors:
        - '#7b2d3b'
        - '#e8d9a0'
        - '#e5a0ae'
        legend:
          position: bottom
        dataLabels:
          enabled: true
    - type: custom:apexcharts-card
      chart_type: donut
      header:
        show: true
        title: By category
        show_states: false
      series:
      - entity: sensor.cellar_tracker_category_dry
        name: Dry
      - entity: sensor.cellar_tracker_category_sparkling
        name: Sparkling
      - entity: sensor.cellar_tracker_category_fortified
        name: Fortified
      - entity: sensor.cellar_tracker_category_sweet_dessert
        name: Sweet/Dessert
      apex_config:
        colors:
        - '#7b2d3b'
        - '#c9a227'
        - '#4a6741'
        - '#8c5a3c'
        legend:
          position: bottom
        dataLabels:
          enabled: true
  - type: grid
    cards:
    - type: heading
      heading: Origin
      heading_style: title
    - type: custom:apexcharts-card
      chart_type: donut
      header:
        show: true
        title: By country
        show_states: false
      series:
      - entity: sensor.cellar_tracker_country_france
        name: France
      - entity: sensor.cellar_tracker_country_italy
        name: Italy
      - entity: sensor.cellar_tracker_country_germany
        name: Germany
      - entity: sensor.cellar_tracker_country_spain
        name: Spain
      - entity: sensor.cellar_tracker_country_portugal
        name: Portugal
      - entity: sensor.cellar_tracker_country_united_kingdom
        name: United Kingdom
      - entity: sensor.cellar_tracker_country_usa
        name: USA
      - entity: sensor.cellar_tracker_country_south_africa
        name: South Africa
      apex_config:
        colors:
        - '#7b2d3b'
        - '#c9a227'
        - '#4a6741'
        - '#8c5a3c'
        - '#5b7c99'
        - '#a0522d'
        - '#6b4e71'
        - '#b5651d'
        legend:
          position: bottom
        dataLabels:
          enabled: true
    - type: custom:apexcharts-card
      chart_type: donut
      header:
        show: true
        title: By bottle size
        show_states: false
      series:
      - entity: sensor.cellar_tracker_size_750ml
        name: 750ml
      - entity: sensor.cellar_tracker_size_1_5l
        name: 1.5L
      - entity: sensor.cellar_tracker_size_375ml
        name: 375ml
      - entity: sensor.cellar_tracker_size_620ml
        name: 620ml
      - entity: sensor.cellar_tracker_size_350ml
        name: 350ml
      apex_config:
        colors:
        - '#7b2d3b'
        - '#c9a227'
        - '#4a6741'
        - '#8c5a3c'
        - '#5b7c99'
        legend:
          position: bottom
        dataLabels:
          enabled: true
  - type: grid
    cards:
    - type: heading
      heading: Quality & value
      heading_style: title
    - type: custom:apexcharts-card
      chart_type: donut
      header:
        show: true
        title: By type
        show_states: false
      series:
      - entity: sensor.cellar_tracker_type_red
        name: Red
      - entity: sensor.cellar_tracker_type_white
        name: White
      - entity: sensor.cellar_tracker_type_white_sparkling
        name: White - Sparkling
      - entity: sensor.cellar_tracker_type_red_fortified
        name: Red - Fortified
      - entity: sensor.cellar_tracker_type_white_off_dry
        name: White - Off-dry
      - entity: sensor.cellar_tracker_type_ros_sparkling
        name: Rosé - Sparkling
      apex_config:
        colors:
        - '#7b2d3b'
        - '#c9a227'
        - '#4a6741'
        - '#8c5a3c'
        - '#5b7c99'
        - '#a0522d'
        legend:
          position: bottom
        dataLabels:
          enabled: true
    - type: statistics-graph
      title: Cellar value
      entities:
      - sensor.cellar_tracker_total_value
      stat_types:
      - state
      days_to_show: 365
      period: day
- title: Explore
  path: explore
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Who made it
      heading_style: title
    - type: custom:flex-table-card
      title: Producer
      entities:
        include: sensor.cellar_tracker_by_producer
      max_rows: 30
      sort_by: count-
      css:
        tbody tr:nth-child(odd): 'background-color: var(--table-row-alternative-background-color);'
        tbody tr: 'height: 30px;'
      columns:
      - name: Producer
        id: name
        data: items.name
      - name: Btl
        id: count
        data: items.count
      - name: Avg
        id: value_avg
        data: items.value_avg
        modify: parseFloat(x).toFixed(0)
      - name: CT
        id: score_avg
        data: items.score_avg
        modify: 'x === null ? ''–'' : parseFloat(x).toFixed(1)'
    - type: custom:flex-table-card
